<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Remote Viewer</title>
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Overrides for better video fitting without zoom out */
        .video-container {
            height: 75vh; /* Prevents overflow */
            position: relative;
        }
        
        #remoteVideo {
            object-fit: contain; /* Shrinks the video to fit entirely */
        }

        #screenFrame {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none; /* Hidden by default - shown in screen mode */
        }

        .view-switch {
            background-color: #2196F3 !important;
            font-weight: bold;
        }

        .view-switch:hover {
            background-color: #0b7dda !important;
        }

        #fpsCounter {
            position: absolute;
            top: 8px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #4CAF50;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            display: none; /* Only shown in screen mode */
            z-index: 10;
        }

        #signalBtn {
            background-color: #FF5722;
            color: white;
        }
    </style>
    <!-- Include PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- Include MQTT for Auto-Discovery -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Live Remote Viewer</h1>
        <div class="status-container">
            Status: <span id="statusText">Waiting for connection...</span>
        </div>
        
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline controls></video>
            <canvas id="screenFrame" style="display: none; width: 100%; height: 100%; object-fit: contain;"></canvas>
            <div id="mapContainer" style="display: none; width: 100%; height: 100%; position: relative;">
                <div id="map" style="width: 100%; height: 100%;"></div>
            </div>
            <span id="fpsCounter">0 FPS</span>
            
            <!-- Network Stats Overlay -->
            <div id="networkStats">Ping: -- ms | Bitrate: -- kbps</div>
            
            <!-- Hidden Video for Canvas PiP Support -->
            <video id="pipVideo" autoplay playsinline muted style="display: none;"></video>
        </div>

        <div class="device-selection" style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
            <label for="deviceIdInput" style="font-weight: bold;">Select Phone:</label>
            <select id="deviceIdInput" style="padding: 5px; font-size: 16px; width: 250px;">
                <option value="">Searching...</option>
            </select>
            <button id="renameDeviceBtn" class="rename-btn" style="padding: 6px 12px; font-size: 14px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">✏️ Rename</button>
        </div>

        <div class="controls">
            <button id="connectBtn">Connect</button>
            <button id="signalBtn">Signal</button>
            <button id="disconnectBtn" disabled>Disconnect</button>
        </div>
        
        <div class="controls extra-controls" style="margin-top: 10px;">
            <button id="switchViewBtn" disabled><i class="fas fa-desktop"></i> Switch to Screen</button>
            <button id="switchCamBtn" disabled>Switch Cam (F/B)</button>
            <button id="mapViewBtn" disabled><i class="fas fa-map-marker-alt"></i> Location Map</button>
            <button id="snapshotBtn" disabled>Snapshot</button>
            <button id="recordBtn" disabled>Start Record</button>
            <button id="pipBtn" disabled>PiP Mode</button>
            <button id="muteAudioBtn" disabled>Mute Audio</button>
            <div style="display: inline-block; margin-left: 10px; vertical-align: middle;">
                <label for="volumeSlider" style="color: white; font-size: 14px; margin-right: 5px;">Volume:</label>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1" disabled style="vertical-align: middle; width: 80px;">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
